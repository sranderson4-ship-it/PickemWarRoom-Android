name: Build BBB Golf APK

on:
  workflow_dispatch:
  push:
    branches: [ bbb-golf-android ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk BBBGolf-Android-v0.3.3-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BBBGolf-Android-v0.3.3-unsigned
          path: BBBGolf-Android-v0.3.3-unsigned.apk
